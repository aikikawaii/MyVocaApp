<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocab — 나만의 영단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --bg-1: #111111;
  --bg-2: #1a1a1a;
  --bg-3: #242424;
  --bg-hover: #2a2a2a;
  --border: rgba(255,255,255,0.07);
  --border-md: rgba(255,255,255,0.12);
  --border-hi: rgba(255,255,255,0.22);
  --text-1: #f0f0f0;
  --text-2: #888888;
  --text-3: #555555;
  --accent: #5c6bc0;
  --accent-dim: rgba(92,107,192,0.15);
  --accent-hi: #7986cb;
  --green: #4caf7d;
  --green-dim: rgba(76,175,125,0.12);
  --red: #e05c5c;
  --red-dim: rgba(224,92,92,0.12);
  --amber: #e8a838;
  --amber-dim: rgba(232,168,56,0.12);
  --purple: #ab6bf5;
  --purple-dim: rgba(171,107,245,0.12);
  --font: 'Pretendard', -apple-system, sans-serif;
  --mono: 'Geist Mono', monospace;
  --r: 8px;
  --r-lg: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text-1); font-family: var(--font); font-size: 14px; }

/* SCROLLBAR */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 99px; }

/* LAYOUT */
.app { display: flex; flex-direction: column; height: 100vh; max-width: 1200px; margin: 0 auto; }

/* HEADER */
.hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 52px; border-bottom: 1px solid var(--border);
  flex-shrink: 0; position: relative; z-index: 20;
}
.hdr-logo { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--text-1); letter-spacing: 0.08em; }
.hdr-logo span { color: var(--accent-hi); }
.cloud-pill {
  display: flex; align-items: center; gap: 6px; padding: 4px 10px;
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 99px;
  font-size: 11px; font-family: var(--mono); color: var(--text-2);
}
.cloud-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); transition: background 0.4s; }

/* NAV */
.nav {
  display: flex; align-items: center; gap: 2px;
  padding: 8px 16px 0; border-bottom: 1px solid var(--border);
  flex-shrink: 0; overflow-x: auto;
}
.nav::-webkit-scrollbar { display: none; }
.nav-btn {
  position: relative; display: flex; align-items: center; gap: 6px;
  padding: 7px 12px; border-radius: var(--r) var(--r) 0 0;
  font-size: 12px; font-weight: 500; color: var(--text-2);
  border: none; background: transparent; cursor: pointer;
  white-space: nowrap; transition: color 0.15s, background 0.15s;
  letter-spacing: 0.01em;
}
.nav-btn:hover { color: var(--text-1); background: var(--bg-2); }
.nav-btn.active { color: var(--text-1); background: var(--bg-2); border: 1px solid var(--border); border-bottom: 1px solid var(--bg-2); }
.nav-btn.active::after {
  content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px;
  background: var(--bg-2);
}
.nav-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 16px; height: 16px; padding: 0 4px;
  background: var(--red); color: #fff; font-size: 9px; font-weight: 600;
  border-radius: 99px; font-family: var(--mono);
}

/* VIEWS */
.views { flex: 1; overflow: hidden; position: relative; }
.view { position: absolute; inset: 0; overflow-y: auto; padding: 24px 20px; display: none; }
.view.active { display: block; }

/* ── MANAGE ── */
.input-row {
  display: flex; gap: 8px; margin-bottom: 20px;
  background: var(--bg-1); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 8px;
}
.input-row input {
  flex: 1; background: var(--bg-2); border: 1px solid var(--border);
  border-radius: var(--r); padding: 9px 12px; color: var(--text-1);
  font-family: var(--font); font-size: 13px; outline: none;
  transition: border-color 0.15s;
}
.input-row input:focus { border-color: var(--accent); }
.input-row input::placeholder { color: var(--text-3); }
.btn-add {
  display: flex; align-items: center; gap: 6px;
  padding: 9px 16px; background: var(--accent); color: #fff;
  border: none; border-radius: var(--r); font-family: var(--font);
  font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: background 0.15s; flex-shrink: 0;
}
.btn-add:hover { background: var(--accent-hi); }

.toolbar {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;
}
.stat-chip {
  font-family: var(--mono); font-size: 11px; color: var(--text-2);
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 99px; padding: 4px 10px;
}
.stat-chip b { color: var(--text-1); }
.search-wrap { position: relative; flex: 1; min-width: 120px; }
.search-wrap input {
  width: 100%; background: var(--bg-2); border: 1px solid var(--border);
  border-radius: var(--r); padding: 7px 10px 7px 32px; color: var(--text-1);
  font-family: var(--font); font-size: 12px; outline: none;
  transition: border-color 0.15s;
}
.search-wrap input:focus { border-color: var(--border-md); }
.search-wrap input::placeholder { color: var(--text-3); }
.search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 13px; }

.btn-sm {
  padding: 6px 12px; background: var(--bg-2); border: 1px solid var(--border);
  border-radius: var(--r); font-family: var(--font); font-size: 12px;
  color: var(--text-2); cursor: pointer; white-space: nowrap;
  transition: border-color 0.15s, color 0.15s;
}
.btn-sm:hover { border-color: var(--border-hi); color: var(--text-1); }
.btn-sm.danger:hover { border-color: var(--red); color: var(--red); }

select.sort-sel {
  padding: 6px 10px; background: var(--bg-2); border: 1px solid var(--border);
  border-radius: var(--r); font-family: var(--font); font-size: 12px;
  color: var(--text-2); outline: none; cursor: pointer;
}

/* WORD LIST */
.word-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 8px;
}
.word-card {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg-1); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 12px 14px; gap: 12px;
  transition: border-color 0.15s, background 0.15s;
  animation: fadeUp 0.2s ease forwards;
}
.word-card:hover { border-color: var(--border-md); background: var(--bg-2); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

.wc-left { flex: 1; min-width: 0; }
.wc-en {
  font-size: 15px; font-weight: 600; color: var(--text-1);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: block; transform-origin: left;
}
.wc-ko { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.wc-tags { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.tag {
  font-family: var(--mono); font-size: 10px; padding: 2px 6px;
  border-radius: 4px; border: 1px solid;
}
.tag-wrong { background: var(--red-dim); color: var(--red); border-color: rgba(224,92,92,0.25); }
.tag-dup   { background: var(--amber-dim); color: var(--amber); border-color: rgba(232,168,56,0.25); }

.wc-actions { display: flex; gap: 4px; flex-shrink: 0; }
.icon-btn {
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid transparent; border-radius: var(--r);
  color: var(--text-3); cursor: pointer; font-size: 13px;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.icon-btn:hover { background: var(--bg-3); border-color: var(--border); color: var(--text-1); }
.icon-btn.edit:hover { color: var(--green); }
.icon-btn.del:hover  { color: var(--red); }
.icon-btn.analyse:hover { color: var(--accent-hi); }

/* PAGINATION */
.pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; }
.page-btn {
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r);
  color: var(--text-2); cursor: pointer; font-size: 12px;
  transition: border-color 0.12s, color 0.12s;
}
.page-btn:hover:not(:disabled) { border-color: var(--border-hi); color: var(--text-1); }
.page-btn:disabled { opacity: 0.3; cursor: default; }
.page-info { font-family: var(--mono); font-size: 11px; color: var(--text-2); padding: 0 8px; }

/* EMPTY */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 64px 20px; gap: 8px; }
.empty-icon { font-size: 32px; opacity: 0.2; }
.empty-text { font-size: 13px; color: var(--text-3); }

/* ── STUDY TAB ── */
.study-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
@media (max-width: 600px) { .study-grid { grid-template-columns: 1fr; } }

.study-card {
  background: var(--bg-1); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 20px; cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.study-card:hover { border-color: var(--border-md); background: var(--bg-2); }
.study-card.active-card { border-color: var(--accent); }
.sc-label { font-size: 11px; font-family: var(--mono); color: var(--text-2); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
.sc-title { font-size: 18px; font-weight: 600; color: var(--text-1); margin-bottom: 4px; }
.sc-sub { font-size: 12px; color: var(--text-2); }
.sc-count { font-family: var(--mono); font-size: 28px; font-weight: 600; }
.sc-count.red { color: var(--red); }
.sc-count.green { color: var(--green); }
.sc-count.accent { color: var(--accent-hi); }
.sc-count.amber { color: var(--amber); }

.mode-btns { display: flex; gap: 8px; margin-bottom: 20px; }
.mode-btn {
  flex: 1; padding: 10px; background: var(--bg-2); border: 1px solid var(--border);
  border-radius: var(--r-lg); font-family: var(--font); font-size: 13px; font-weight: 500;
  color: var(--text-2); cursor: pointer; transition: all 0.15s; text-align: center;
}
.mode-btn:hover { border-color: var(--border-md); color: var(--text-1); }
.mode-btn.primary { background: var(--accent-dim); border-color: var(--accent); color: var(--accent-hi); }
.mode-btn.primary:hover { background: rgba(92,107,192,0.25); }
.mode-btn.secondary { background: var(--green-dim); border-color: rgba(76,175,125,0.35); color: var(--green); }
.mode-btn.danger-mode { background: var(--red-dim); border-color: rgba(224,92,92,0.35); color: var(--red); }

/* FLASH CARD AREA */
.flash-wrap { display: none; }
.flash-wrap.active { display: flex; flex-direction: column; }
.flash-progress-bar { height: 2px; background: var(--bg-3); border-radius: 99px; margin-bottom: 20px; overflow: hidden; }
.flash-progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.3s ease; }

.flash-card {
  background: var(--bg-1); border: 1px solid var(--border);
  border-radius: 16px; padding: 48px 32px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; min-height: 240px; position: relative;
  margin-bottom: 12px;
}
.flash-en { font-size: 42px; font-weight: 700; color: var(--text-1); letter-spacing: -0.02em; margin-bottom: 8px; }
.flash-ko { font-size: 24px; font-weight: 500; color: var(--accent-hi); margin-top: 20px; display: none; }
.flash-meta { font-size: 11px; font-family: var(--mono); color: var(--text-3); }

.flash-btns { display: flex; gap: 10px; }
.flash-btn {
  flex: 1; padding: 14px; border-radius: var(--r-lg); font-family: var(--font);
  font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid;
  transition: opacity 0.15s;
}
.flash-btn:hover { opacity: 0.8; }
.flash-btn.reveal { background: var(--bg-2); border-color: var(--border-md); color: var(--text-1); }
.flash-btn.wrong  { background: var(--red-dim); border-color: rgba(224,92,92,0.3); color: var(--red); }
.flash-btn.right  { background: var(--green-dim); border-color: rgba(76,175,125,0.3); color: var(--green); }

/* QUIZ AREA */
.quiz-wrap { display: none; }
.quiz-wrap.active { display: flex; flex-direction: column; }
.quiz-timer-bar { height: 3px; background: var(--bg-3); border-radius: 99px; margin-bottom: 16px; overflow: hidden; }
.quiz-timer-fill {
  height: 100%; border-radius: 99px; width: 100%;
  background: var(--accent); transition: width 0.1s linear, background 0.3s;
}
.quiz-timer-fill.warn { background: var(--amber); }
.quiz-timer-fill.danger { background: var(--red); animation: blink 0.5s infinite; }
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

.quiz-word {
  background: var(--bg-1); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 36px;
  text-align: center; margin-bottom: 12px;
}
.quiz-word-label { font-size: 10px; font-family: var(--mono); color: var(--text-3); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; }
.quiz-word-en { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; }
.quiz-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quiz-opt {
  padding: 16px; background: var(--bg-1); border: 1px solid var(--border);
  border-radius: var(--r-lg); font-size: 14px; font-weight: 500; color: var(--text-1);
  cursor: pointer; text-align: center; transition: border-color 0.12s, background 0.12s;
}
.quiz-opt:not(:disabled):hover { border-color: var(--border-md); background: var(--bg-2); }
.quiz-opt.correct { background: var(--green-dim) !important; border-color: rgba(76,175,125,0.5) !important; color: var(--green) !important; }
.quiz-opt.wrong   { background: var(--red-dim) !important; border-color: rgba(224,92,92,0.5) !important; color: var(--red) !important; animation: shake 0.3s ease; }
.quiz-opt.reveal  { background: var(--green-dim) !important; border-color: rgba(76,175,125,0.5) !important; color: var(--green) !important; transition-delay: 0.1s; }
.quiz-opt.dimmed  { opacity: 0.3; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

.quiz-hud { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.hud-pill {
  font-family: var(--mono); font-size: 11px; color: var(--text-2);
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 99px; padding: 4px 10px;
}
.combo-pill {
  font-family: var(--mono); font-size: 11px; color: var(--amber);
  background: var(--amber-dim); border: 1px solid rgba(232,168,56,0.25);
  border-radius: 99px; padding: 4px 10px;
}

/* SRS AREA */
.srs-wrap { display: none; }
.srs-wrap.active { display: flex; flex-direction: column; }

/* RESULT SCREEN */
.result-screen {
  display: none; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 48px 20px; gap: 16px;
}
.result-screen.active { display: flex; }
.result-emoji { font-size: 48px; }
.result-title { font-size: 24px; font-weight: 700; }
.result-stats { display: flex; gap: 24px; }
.result-stat { text-align: center; }
.result-stat-n { font-family: var(--mono); font-size: 28px; font-weight: 600; }
.result-stat-l { font-size: 11px; color: var(--text-2); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--mono); }

/* ── STATS ── */
.stats-hero {
  display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 24px;
}
@media (max-width: 640px) { .stats-hero { grid-template-columns: repeat(2,1fr); } }
.stat-card {
  background: var(--bg-1); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 16px;
}
.stat-card-label { font-size: 10px; font-family: var(--mono); color: var(--text-2); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
.stat-card-val { font-size: 28px; font-weight: 700; font-family: var(--mono); color: var(--text-1); }
.stat-card-sub { font-size: 11px; color: var(--text-3); margin-top: 4px; }
.stat-card.accent-card { border-color: rgba(92,107,192,0.25); }
.stat-card.green-card { border-color: rgba(76,175,125,0.2); }
.stat-card.red-card { border-color: rgba(224,92,92,0.2); }
.stat-card.amber-card { border-color: rgba(232,168,56,0.2); }

/* CHART SECTION */
.chart-section { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 20px; margin-bottom: 16px; }
.chart-title { font-size: 12px; font-family: var(--mono); color: var(--text-2); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
.streak-badge { background: var(--amber-dim); border: 1px solid rgba(232,168,56,0.25); border-radius: 99px; padding: 3px 10px; color: var(--amber); font-size: 11px; font-family: var(--mono); }

/* GRASS */
.grass-wrap { overflow-x: auto; padding-bottom: 8px; }
.grass-grid { display: flex; gap: 4px; min-width: max-content; }
.grass-col { display: flex; flex-direction: column; gap: 4px; }
.grass-cell {
  width: 12px; height: 12px; border-radius: 3px; background: var(--bg-3);
  cursor: default; transition: transform 0.1s;
  position: relative;
}
.grass-cell:hover { transform: scale(1.4); z-index: 10; }
.grass-1 { background: rgba(92,107,192,0.25); }
.grass-2 { background: rgba(92,107,192,0.5); }
.grass-3 { background: rgba(92,107,192,0.75); }
.grass-4 { background: #5c6bc0; }

/* BAR CHART */
.bar-chart { display: flex; align-items: flex-end; gap: 3px; height: 80px; }
.bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bar { width: 100%; border-radius: 3px 3px 0 0; min-height: 2px; transition: height 0.4s ease; }
.bar.b-add { background: var(--accent); }
.bar.b-test { background: var(--green); }
.bar.b-quiz { background: var(--purple); }
.bar-label { font-family: var(--mono); font-size: 9px; color: var(--text-3); text-align: center; white-space: nowrap; }

/* ACCURACY RING */
.ring-wrap { display: flex; align-items: center; justify-content: center; gap: 32px; flex-wrap: wrap; }
.ring-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.ring-svg { transform: rotate(-90deg); }
.ring-label { font-size: 11px; font-family: var(--mono); color: var(--text-2); text-align: center; text-transform: uppercase; letter-spacing: 0.06em; }

/* HEATMAP LEGEND */
.grass-legend { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.grass-legend span { font-size: 10px; color: var(--text-3); font-family: var(--mono); }

/* MODALS */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.15s;
  backdrop-filter: blur(4px);
}
.overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--bg-1); border: 1px solid var(--border-md);
  border-radius: 16px; padding: 28px; width: 100%; max-width: 380px;
  margin: 16px; transform: scale(0.96); transition: transform 0.15s;
}
.overlay.open .modal { transform: scale(1); }
.modal-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; }
.modal-input {
  width: 100%; background: var(--bg-2); border: 1px solid var(--border-md);
  border-radius: var(--r); padding: 10px 12px; color: var(--text-1);
  font-family: var(--font); font-size: 14px; outline: none;
  transition: border-color 0.15s; margin-bottom: 10px;
}
.modal-input:focus { border-color: var(--accent); }
.modal-btns { display: flex; gap: 8px; margin-top: 20px; }
.modal-btn {
  flex: 1; padding: 10px; border-radius: var(--r); font-family: var(--font);
  font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border);
  background: var(--bg-2); color: var(--text-2); transition: all 0.15s;
}
.modal-btn:hover { color: var(--text-1); border-color: var(--border-hi); }
.modal-btn.primary-btn { background: var(--accent); color: #fff; border-color: var(--accent); }
.modal-btn.primary-btn:hover { background: var(--accent-hi); }
.modal-btn.danger-btn { background: var(--red-dim); color: var(--red); border-color: rgba(224,92,92,0.3); }
.modal-btn.danger-btn:hover { background: rgba(224,92,92,0.2); }

/* TOAST */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(8px);
  background: var(--bg-2); border: 1px solid var(--border-md);
  border-radius: 99px; padding: 8px 20px;
  font-size: 12px; font-family: var(--mono); color: var(--text-1);
  z-index: 200; pointer-events: none; opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* SECTION HEAD */
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.section-title { font-size: 11px; font-family: var(--mono); color: var(--text-2); letter-spacing: 0.08em; text-transform: uppercase; }

/* BACK ROW */
.back-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.back-btn {
  display: flex; align-items: center; gap: 4px; background: transparent;
  border: none; color: var(--text-2); font-size: 12px; font-family: var(--font);
  cursor: pointer; padding: 4px 0; transition: color 0.12s;
}
.back-btn:hover { color: var(--text-1); }
.session-info { font-family: var(--mono); font-size: 11px; color: var(--text-3); }

.divider { height: 1px; background: var(--border); margin: 20px 0; }
</style>
</head>

<!-- SIM MATRIX (lightweight) -->
<script>
// ── HELPERS ──
let words = [], activityLog = {}, simMatrix = {};
let currentPage = 1;
const IPP = 15;

const KSC = [ // minimal semantic clusters for similarity
  ['기쁨','행복','즐거움','유쾌','흡족'],['슬픔','우울','비통','서러움','애통'],
  ['분노','화','분개','격분','짜증'],['두려움','공포','무섭','불안','초조'],
  ['용감','대담','용기','씩씩'],['성실','근면','부지런','착실'],
  ['영리','똑똑','현명','총명'],['논리','이성','합리','체계'],
  ['증가','상승','확대','성장'],['감소','하락','축소','줄다'],
  ['강화','보강','견고'],['약화','감퇴','쇠약'],['유지','보존','지속'],
  ['협력','협동','공조'],['경쟁','대결','대립'],['성공','달성','성취'],
  ['실패','좌절','좌절'],['거짓','위선','기만'],['정직','솔직','진실'],
  ['빠른','신속','재빠른'],['느린','더딘','천천히'],
];
const KCM = new Map();
KSC.forEach((c,i) => c.forEach(t => KCM.set(t,i)));

function semSim(a, b) {
  const tok = s => new Set(s.split(/[,\/\s]+/).map(t=>t.trim()).filter(Boolean));
  const tA = tok(a), tB = tok(b);
  let score = 0;
  const cA = new Set(), cB = new Set();
  tA.forEach(t => { if(KCM.has(t)) cA.add(KCM.get(t)); });
  tB.forEach(t => { if(KCM.has(t)) cB.add(KCM.get(t)); });
  let shared = 0; cA.forEach(c => { if(cB.has(c)) shared++; });
  if(shared) score += Math.min(70, 45 + shared*10);
  let ex = 0; tA.forEach(t => { if(tB.has(t)) ex++; });
  score += Math.round(ex / Math.max(1, new Set([...tA,...tB]).size) * 20);
  return Math.min(100, score);
}
function buildSim() {
  simMatrix = {};
  for(let i=0;i<words.length;i++) for(let j=i+1;j<words.length;j++) {
    const a=words[i],b=words[j];
    if(!simMatrix[a.id]) simMatrix[a.id]={};
    if(!simMatrix[b.id]) simMatrix[b.id]={};
    const s=semSim(a.ko,b.ko);
    simMatrix[a.id][b.id]=s; simMatrix[b.id][a.id]=s;
  }
}

// ── STORAGE ──
let _lsTimer;
function scheduleSave() { clearTimeout(_lsTimer); _lsTimer = setTimeout(()=>{ localStorage.setItem('vocab_words', JSON.stringify(words)); }, 300); }
function saveActivity() { localStorage.setItem('vocab_activity', JSON.stringify(activityLog)); }
function loadData() {
  try { words = JSON.parse(localStorage.getItem('vocab_words')||'[]'); } catch { words=[]; }
  try { activityLog = JSON.parse(localStorage.getItem('vocab_activity')||'{}'); } catch { activityLog={}; }
}
function saveData(skipRender=false) {
  scheduleSave(); saveActivity();
  if(!skipRender) renderWords();
  if(window.triggerCloud) window.triggerCloud({words, activityLog});
}
window.updateFromCloud = data => {
  words = data.words || data || [];
  if(data.activityLog) activityLog = data.activityLog;
  localStorage.setItem('vocab_words', JSON.stringify(words));
  localStorage.setItem('vocab_activity', JSON.stringify(activityLog));
  buildSim(); renderWords(); updateStudyDashboard(); updateSRSBadge();
};
function logAct(type) {
  const d = todayStr();
  if(!activityLog[d]) activityLog[d] = {added:0,tested:0,quizzed:0};
  activityLog[d][type]++;
  saveActivity();
}

// ── DATE ──
function todayStr() {
  return new Date().toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul'}).replace(/\.\s*/g,'-').replace(/-$/,'').split('-').map((v,i)=>i>0?v.padStart(2,'0'):v).join('-');
}
function daysFromNow(n) {
  const d=new Date(); d.setDate(d.getDate()+n);
  return d.toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul'}).replace(/\.\s*/g,'-').replace(/-$/,'').split('-').map((v,i)=>i>0?v.padStart(2,'0'):v).join('-');
}

// ── WORDS ──
function addWord() {
  const en=document.getElementById('in-en').value.trim();
  const ko=document.getElementById('in-ko').value.trim();
  if(!en||!ko) return toast('영어 단어와 뜻을 입력하세요');
  const w={id:Date.now(),en,ko,wrongCount:0,quizCount:0,srs:null};
  words.push(w);
  if(!simMatrix[w.id]) simMatrix[w.id]={};
  words.forEach(x=>{ if(x.id!==w.id){ const s=semSim(w.ko,x.ko); simMatrix[w.id][x.id]=s; if(!simMatrix[x.id])simMatrix[x.id]={}; simMatrix[x.id][w.id]=s; } });
  document.getElementById('in-en').value=''; document.getElementById('in-ko').value='';
  document.getElementById('in-en').focus();
  currentPage=1; logAct('added'); saveData(); updateStudyDashboard(); updateSRSBadge();
  toast('단어 추가 완료 ✓');
}

let _deleteId=null;
function confirmDelete(id) { _deleteId=id; openModal('delete-overlay'); }
function executeDelete() {
  words=words.filter(w=>w.id!==_deleteId);
  delete simMatrix[_deleteId];
  closeModal('delete-overlay'); saveData(); updateStudyDashboard(); toast('삭제됨');
}
function confirmClearAll() { if(!words.length) return toast('단어가 없습니다'); openModal('clear-overlay'); }
function executeClearAll() { words=[]; simMatrix={}; closeModal('clear-overlay'); saveData(); updateStudyDashboard(); toast('전체 삭제됨'); }

let _editId=null;
function openEdit(id) {
  const w=words.find(x=>x.id===id); if(!w) return;
  _editId=id;
  document.getElementById('edit-en-in').value=w.en;
  document.getElementById('edit-ko-in').value=w.ko;
  openModal('edit-overlay');
}
function saveEdit() {
  const en=document.getElementById('edit-en-in').value.trim();
  const ko=document.getElementById('edit-ko-in').value.trim();
  if(!en||!ko) return;
  const i=words.findIndex(w=>w.id===_editId);
  if(i!==-1){ words[i].en=en; words[i].ko=ko; saveData(); closeModal('edit-overlay'); toast('수정됨'); }
}

function shuffle(a) { const b=[...a]; for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]; } return b; }

// ── RENDER WORDS ──
function renderWords() {
  const q=document.getElementById('search-in').value.toLowerCase().trim();
  const sort=document.getElementById('sort-sel').value;
  let disp=[...words];
  if(q) disp=disp.filter(w=>w.en.toLowerCase().includes(q)||w.ko.includes(q));
  if(sort==='wrong') disp.sort((a,b)=>(b.wrongCount||0)-(a.wrongCount||0));
  else disp.sort((a,b)=>b.id-a.id);
  document.getElementById('word-count').textContent=disp.length;
  const total=Math.max(1,Math.ceil(disp.length/IPP));
  currentPage=Math.max(1,Math.min(currentPage,total));
  const slice=disp.slice((currentPage-1)*IPP,currentPage*IPP);
  const list=document.getElementById('word-list');
  if(!slice.length){ list.innerHTML=`<div class="empty"><div class="empty-icon">◻</div><div class="empty-text">${q?'검색 결과 없음':'단어를 추가해보세요'}</div></div>`; }
  else {
    list.innerHTML=slice.map(w=>{
      const dups=Object.values(simMatrix[w.id]||{}).some(s=>s>=75);
      const tags=(w.wrongCount>0?`<span class="tag tag-wrong">오답 ${w.wrongCount}</span>`:'')+(dups?`<span class="tag tag-dup">유사 중복</span>`:'');
      return `<div class="word-card">
        <div class="wc-left">
          <span class="wc-en">${w.en}</span>
          <div class="wc-ko">${w.ko}</div>
          ${tags?`<div class="wc-tags">${tags}</div>`:''}
        </div>
        <div class="wc-actions">
          <button class="icon-btn analyse" onclick="toast('분석 기능 준비중')" title="분석">⊕</button>
          <button class="icon-btn edit" onclick="openEdit(${w.id})" title="수정">✎</button>
          <button class="icon-btn del" onclick="confirmDelete(${w.id})" title="삭제">✕</button>
        </div>
      </div>`;
    }).join('');
  }
  // Pagination
  const pg=document.getElementById('pagination');
  if(total<=1){ pg.innerHTML=''; return; }
  pg.innerHTML=`
    <button class="page-btn" onclick="changePage(-1)" ${currentPage===1?'disabled':''}>‹</button>
    <span class="page-info">${currentPage} / ${total}</span>
    <button class="page-btn" onclick="changePage(1)" ${currentPage===total?'disabled':''}>›</button>`;
}
function changePage(d) { currentPage+=d; renderWords(); document.getElementById('word-list').scrollTop=0; }

function exportData() {
  if(!words.length) return toast('내보낼 단어가 없습니다');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(words,null,2)],{type:'application/json'}));
  a.download='vocab.json'; document.body.appendChild(a); a.click(); a.remove();
}
function importData(e) {
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{
    try {
      const imp=JSON.parse(ev.target.result);
      if(!Array.isArray(imp)) throw 0;
      imp.forEach(w=>{ if(w.en&&w.ko) words.push({id:Date.now()+Math.random(),en:w.en,ko:w.ko,wrongCount:w.wrongCount||0,quizCount:0,srs:null}); });
      buildSim(); saveData(); currentPage=1; toast(`${imp.length}개 단어 불러오기 완료`);
    } catch { toast('파일 형식 오류'); }
  };
  r.readAsText(file); e.target.value='';
}

// ── SRS ──
const SRS_NEW_DAY=20, EASE_DEF=2.5, EASE_MIN=1.3;
function srsDue() { const t=todayStr(); return words.filter(w=>w.srs&&w.srs.due&&w.srs.due<=t); }
function srsNew()  { return words.filter(w=>!w.srs||!w.srs.due); }
function sm2(srs,g) {
  let {interval=0,ease=EASE_DEF,reps=0,lapses=0}=srs||{};
  ease=Math.max(EASE_MIN,ease);
  if(g===1) { lapses++; return {interval:0,ease:Math.max(EASE_MIN,ease-0.2),reps:0,lapses,due:daysFromNow(0),minutesDelay:10}; }
  if(g===2) { return {interval:1,ease:Math.max(EASE_MIN,ease-0.15),reps:reps+1,lapses,due:daysFromNow(1)}; }
  if(reps===0) interval=1; else if(reps===1) interval=6; else interval=Math.round(interval*ease);
  ease=g===4?Math.min(3,ease+0.15):Math.max(EASE_MIN,ease-0.05);
  return {interval,ease,reps:reps+1,lapses:lapses||0,due:daysFromNow(interval)};
}
function updateSRSBadge() {

// ── STUDY ENGINE ──
let studyMode='', studyQ=[], studyIdx=0, studyCorrect=0, studyWrong=0;
let quizWord=null, quizTimer=null, quizTimerInterval=null, quizTimeLeft=100;
let quizCombo=0, quizBestCombo=0, quizScore=0, quizAnswered=0;

function studyStart(mode) {
  studyMode=mode;
  document.getElementById('study-intro').style.display='none';
  document.getElementById('result-screen').classList.remove('active');

  if(mode==='flash-all'||mode==='flash-wrong') {
    let pool=mode==='flash-all'?[...words]:words.filter(w=>w.wrongCount>0);
    if(!pool.length) { toast('단어가 없습니다'); showIntro(); return; }
    studyQ=shuffle(pool); studyIdx=0; studyCorrect=0; studyWrong=0;
    showFlash();
  } else if(mode==='srs-due'||mode==='srs-new') {
    let pool=mode==='srs-due'?srsDue():srsNew().slice(0,SRS_NEW_DAY);
    if(!pool.length) { toast(mode==='srs-due'?'복습할 단어 없음':'신규 단어 없음'); showIntro(); return; }
    studyQ=shuffle(pool); studyIdx=0; studyCorrect=0; studyWrong=0;
    showSRS();
  } else if(mode==='quiz-all'||mode==='quiz-wrong') {
    let pool=mode==='quiz-all'?[...words]:words.filter(w=>w.wrongCount>0);
    if(pool.length<4) { toast('단어 4개 이상 필요'); showIntro(); return; }
    studyQ=shuffle(pool); studyIdx=0; quizCombo=0; quizBestCombo=0; quizScore=0; quizAnswered=0;
    showQuiz();
  }
}

function showIntro() {
  document.getElementById('study-intro').style.display='';
  document.getElementById('flash-wrap').classList.remove('active');
  document.getElementById('srs-wrap').classList.remove('active');
  document.getElementById('quiz-wrap').classList.remove('active');
  document.getElementById('result-screen').classList.remove('active');
  updateStudyDashboard();
}
function exitStudy() { stopQuizTimer(); showIntro(); }

// ─ FLASH ─
function showFlash() {
  document.getElementById('flash-wrap').classList.add('active');
  loadFlashCard();
}
function loadFlashCard() {
  if(studyIdx>=studyQ.length){ showStudyResult(); return; }
  const w=studyQ[studyIdx];
  document.getElementById('flash-progress-txt').textContent=`${studyIdx+1} / ${studyQ.length}`;
  document.getElementById('flash-fill').style.width=`${(studyIdx/studyQ.length)*100}%`;
  document.getElementById('flash-en').textContent=w.en;
  document.getElementById('flash-ko').textContent=w.ko;
  document.getElementById('flash-ko').style.display='none';
  document.getElementById('flash-meta').textContent=`${studyMode==='flash-wrong'?'오답 '+w.wrongCount+'회':''}`;
  document.getElementById('flash-reveal-btn').style.display='';
  document.getElementById('flash-grade-btns').style.display='none';
}
function flashReveal() {
  document.getElementById('flash-ko').style.display='';
  document.getElementById('flash-reveal-btn').style.display='none';
  document.getElementById('flash-grade-btns').style.display='flex';
}
function flashGrade(ok) {
  const w=studyQ[studyIdx];
  if(ok) { studyCorrect++; }
  else {
    studyWrong++;
    const i=words.findIndex(x=>x.id===w.id);
    if(i!==-1){ words[i].wrongCount=(words[i].wrongCount||0)+1; saveData(true); }
  }
  logAct('tested'); studyIdx++;
  if(studyIdx>=studyQ.length) { document.getElementById('flash-fill').style.width='100%'; setTimeout(showStudyResult,200); }
  else loadFlashCard();
}

// ─ SRS ─
function showSRS() {
  document.getElementById('srs-wrap').classList.add('active');
  loadSRSCard();
}
function loadSRSCard() {
  if(studyIdx>=studyQ.length){ showStudyResult(); return; }
  const w=studyQ[studyIdx];
  const srs=w.srs||{};
  document.getElementById('srs-progress-txt').textContent=`${studyIdx+1} / ${studyQ.length}`;
  document.getElementById('srs-fill').style.width=`${(studyIdx/studyQ.length)*100}%`;
  document.getElementById('srs-en').textContent=w.en;
  document.getElementById('srs-ko').textContent=w.ko;
  document.getElementById('srs-ko').style.display='none';
  document.getElementById('srs-meta').textContent=srs.reps>0?`간격 ${srs.interval||0}일 · ${srs.reps}회째`:'신규';
  const g3=sm2(srs,3), g4=sm2(srs,4);
  document.getElementById('srs-g3-lbl').textContent=`+${g3.interval||1}일`;
  document.getElementById('srs-g4-lbl').textContent=`+${g4.interval||6}일`;
  document.getElementById('srs-reveal-area').style.display='';
  document.getElementById('srs-grade-area').style.display='none';
}
function srsReveal() {
  document.getElementById('srs-ko').style.display='';
  document.getElementById('srs-reveal-area').style.display='none';
  document.getElementById('srs-grade-area').style.display='';
}
function srsGrade(g) {
  const w=studyQ[studyIdx];
  const i=words.findIndex(x=>x.id===w.id);
  if(i!==-1){ words[i].srs=sm2(words[i].srs||{},g); saveData(true); }
  if(g>=3) studyCorrect++; else studyWrong++;
  logAct('tested'); studyIdx++;
  setTimeout(loadSRSCard, 150);
}

// ─ QUIZ ─
const QUIZ_TIME=15;
function showQuiz() {
  document.getElementById('quiz-wrap').classList.add('active');
  nextQuiz();
}
function stopQuizTimer() { clearInterval(quizTimerInterval); quizTimerInterval=null; }
function startQuizTimer() {
  stopQuizTimer(); quizTimeLeft=100;
  const fill=document.getElementById('quiz-timer-fill');
  fill.style.width='100%'; fill.className='quiz-timer-fill';
  const step=100/(QUIZ_TIME*10);
  quizTimerInterval=setInterval(()=>{
    quizTimeLeft=Math.max(0,quizTimeLeft-step);
    fill.style.width=quizTimeLeft+'%';
    if(quizTimeLeft<=20) fill.className='quiz-timer-fill danger';
    else if(quizTimeLeft<=40) fill.className='quiz-timer-fill warn';
    if(quizTimeLeft<=0){ stopQuizTimer(); quizTimeout(); }
  },100);
}
function quizTimeout() {
  document.querySelectorAll('.quiz-opt').forEach(b=>{ b.disabled=true; if(b.dataset.correct==='true') b.classList.add('reveal'); else b.classList.add('dimmed'); });
  const i=words.findIndex(x=>x.id===quizWord.id);
  if(i!==-1){ words[i].wrongCount=(words[i].wrongCount||0)+1; saveData(true); }
  quizCombo=0; updateCombo(); quizAnswered++; logAct('quizzed');
  setTimeout(nextQuiz,800);
}
function getDistractors(target) {
  const sim=simMatrix[target.id]||{};
  return words.filter(w=>w.id!==target.id).map(w=>({w,sc:(sim[w.id]||0)*2+Math.random()*5})).sort((a,b)=>b.sc-a.sc).slice(0,3).map(x=>x.w);
}
function nextQuiz() {
  if(studyIdx>=studyQ.length){
    if(studyMode==='quiz-all') { studyQ=shuffle([...words]); studyIdx=0; }
    else { const p=words.filter(w=>w.wrongCount>0); if(!p.length){ showQuizResult(); return; } studyQ=shuffle(p); studyIdx=0; }
  }
  quizWord=studyQ[studyIdx++];
  document.getElementById('quiz-word-en').textContent=quizWord.en;
  const opts=shuffle([{w:quizWord,ok:true},...getDistractors(quizWord).map(w=>({w,ok:false}))]);
  document.getElementById('quiz-opts').innerHTML=opts.map(o=>`<button class="quiz-opt" data-correct="${o.ok}" onclick="selectQuiz(this,${o.ok},${o.w.id})">${o.w.ko}</button>`).join('');
  startQuizTimer();
}
function selectQuiz(btn,ok,selId) {
  stopQuizTimer();
  document.querySelectorAll('.quiz-opt').forEach(b=>b.disabled=true);
  quizAnswered++;
  if(ok){ btn.classList.add('correct'); document.querySelectorAll('.quiz-opt:not([data-correct=true])').forEach(b=>b.classList.add('dimmed')); quizScore++; quizCombo++; if(quizCombo>quizBestCombo)quizBestCombo=quizCombo; }
  else { btn.classList.add('wrong'); document.querySelectorAll('.quiz-opt').forEach(b=>{ if(b.dataset.correct==='true') b.classList.add('reveal'); else if(b!==btn) b.classList.add('dimmed'); }); const i=words.findIndex(w=>w.id===quizWord.id); if(i!==-1){ words[i].wrongCount=(words[i].wrongCount||0)+1; saveData(true); } quizCombo=0; }
  document.getElementById('quiz-score-pill').textContent=`${quizScore}점`;
  updateCombo(); logAct('quizzed');
  setTimeout(nextQuiz,ok?450:800);
}
function updateCombo() {
  const p=document.getElementById('combo-pill');
  if(quizCombo>=2){ p.style.display=''; p.textContent=`🔥 ${quizCombo} 콤보`; }
  else p.style.display='none';
}
function showQuizResult() { stopQuizTimer(); const acc=quizAnswered>0?Math.round(quizScore/quizAnswered*100):0; showStudyResult(acc); }

// ─ RESULTS ─
function showStudyResult(quizAcc) {
  document.getElementById('flash-wrap').classList.remove('active');
  document.getElementById('srs-wrap').classList.remove('active');
  document.getElementById('quiz-wrap').classList.remove('active');
  const rs=document.getElementById('result-screen');
  rs.classList.add('active');
  const isQuiz=studyMode.startsWith('quiz');
  const total=isQuiz?quizAnswered:studyCorrect+studyWrong;
  const correct=isQuiz?quizScore:studyCorrect;
  const acc=isQuiz?(quizAcc??0):total>0?Math.round(correct/total*100):0;
  document.getElementById('result-emoji').textContent=acc>=90?'🏆':acc>=70?'🎉':acc>=50?'😊':'💪';
  document.getElementById('result-title').textContent=acc>=80?'훌륭해요!':acc>=60?'잘했어요!':'계속 도전!';
  document.getElementById('result-sub').textContent=`정확도 ${acc}%`;
  document.getElementById('result-stats').innerHTML=`
    <div class="result-stat"><div class="result-stat-n" style="color:var(--green)">${correct}</div><div class="result-stat-l">정답</div></div>
    <div class="result-stat"><div class="result-stat-n" style="color:var(--red)">${total-correct}</div><div class="result-stat-l">오답</div></div>
    ${isQuiz&&quizBestCombo>=3?`<div class="result-stat"><div class="result-stat-n" style="color:var(--amber)">${quizBestCombo}</div><div class="result-stat-l">최고 콤보</div></div>`:''}
  `;
  document.getElementById('result-retry-btn').onclick=()=>studyStart(studyMode);
  updateSRSBadge(); renderWords();
}

// ── STATS ──
function renderStats() {
  const today=todayStr();
  const todayData=activityLog[today]||{};
  const todayTotal=(todayData.added||0)+(todayData.tested||0)+(todayData.quizzed||0);
  document.getElementById('st-total').textContent=words.length;
  document.getElementById('st-today').textContent=todayTotal;
  document.getElementById('st-today-sub').textContent=todayTotal?`추가${todayData.added||0} 학습${todayData.tested||0} 퀴즈${todayData.quizzed||0}`:'오늘 활동 없음';
  document.getElementById('st-wrong').textContent=words.reduce((s,w)=>s+(w.wrongCount||0),0);

  // Streak
  let streak=0, d=new Date();
  while(true){
    const s=d.toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul'}).replace(/\.\s*/g,'-').replace(/-$/,'').split('-').map((v,i)=>i>0?v.padStart(2,'0'):v).join('-');
    const a=activityLog[s];
    if(a&&((a.added||0)+(a.tested||0)+(a.quizzed||0))>0){ streak++; d.setDate(d.getDate()-1); }
    else { if(streak===0){ d.setDate(d.getDate()-1); continue; } break; }
    if(streak>365) break;
  }
  document.getElementById('st-streak').textContent=streak;
  document.getElementById('streak-badge').textContent=`${streak}일 연속`;

  // Bar chart (14 days)
  const bars=document.getElementById('bar-chart'); bars.innerHTML='';
  const maxAct=14;
  let maxVal=1;
  const days14=[];
  for(let i=maxAct-1;i>=0;i--){
    const dd=new Date(); dd.setDate(dd.getDate()-i);
    const s=dd.toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul'}).replace(/\.\s*/g,'-').replace(/-$/,'').split('-').map((v,k)=>k>0?v.padStart(2,'0'):v).join('-');
    const a=activityLog[s]||{};
    const tot=(a.added||0)+(a.tested||0)+(a.quizzed||0);
    if(tot>maxVal) maxVal=tot;
    days14.push({s,a,dd});
  }
  days14.forEach(({s,a,dd})=>{
    const add=a.added||0, test=a.tested||0, quiz=a.quizzed||0;
    const total=add+test+quiz;
    const h=80; const th=Math.round(total/maxVal*h);
    const ah=total?Math.round(add/total*th):0;
    const teh=total?Math.round(test/total*th):0;
    const qh=th-ah-teh;
    const label=dd.getDate()+'일';
    bars.innerHTML+=`<div class="bar-wrap" title="${s}: 추가${add} 학습${test} 퀴즈${quiz}">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:${h}px;gap:1px">
        ${total?`<div class="bar b-add" style="height:${ah}px;width:100%"></div><div class="bar b-test" style="height:${teh}px;width:100%"></div><div class="bar b-quiz" style="height:${Math.max(0,qh)}px;width:100%"></div>`:`<div style="height:2px;width:100%;background:var(--bg-3);border-radius:2px"></div>`}
      </div>
      <div class="bar-label">${label}</div>
    </div>`;
  });

  // Heatmap 70 days
  const grass=document.getElementById('grass-grid'); grass.innerHTML='';
  const weeks=10;
  for(let col=0;col<weeks;col++){
    const colDiv=document.createElement('div'); colDiv.className='grass-col';
    for(let row=0;row<7;row++){
      const dd=new Date(); dd.setDate(dd.getDate()-(weeks*7-1)+(col*7+row));
      const s=dd.toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul'}).replace(/\.\s*/g,'-').replace(/-$/,'').split('-').map((v,i)=>i>0?v.padStart(2,'0'):v).join('-');
      const a=activityLog[s]||{}; const tot=(a.added||0)+(a.tested||0)+(a.quizzed||0);
      const cls=tot>=30?'grass-4':tot>=10?'grass-3':tot>=3?'grass-2':tot>=1?'grass-1':'';
      const cell=document.createElement('div');
      cell.className='grass-cell '+cls;
      cell.title=`${s}: ${tot} 활동`;
      colDiv.appendChild(cell);
    }
    grass.appendChild(colDiv);
  }

  // Accuracy rings
  const totalWords=words.length||1;
  const learnedWords=words.filter(w=>w.srs&&w.srs.reps>0).length;
  const wrongWords=words.filter(w=>w.wrongCount>0).length;
  const totalQuiz=words.reduce((s,w)=>s+(w.quizCount||0)+(w.wrongCount||0),0)||1;
  const totalRight=words.reduce((s,w)=>s+(w.quizCount||0),0);
  const overallAcc=Math.round(totalRight/totalQuiz*100);
  const learnedPct=Math.round(learnedWords/totalWords*100);
  const wrongPct=Math.round(wrongWords/totalWords*100);

  function ring(pct, color, label, valTxt) {
    const r=36, c=2*Math.PI*r, fill=c*(pct/100);
    return `<div class="ring-item">
      <svg class="ring-svg" width="90" height="90" viewBox="0 0 90 90">
        <circle cx="45" cy="45" r="${r}" fill="none" stroke="var(--bg-3)" stroke-width="8"/>
        <circle cx="45" cy="45" r="${r}" fill="none" stroke="${color}" stroke-width="8"
          stroke-dasharray="${fill} ${c}" stroke-linecap="round"/>
        <text x="45" y="45" text-anchor="middle" dominant-baseline="central"
          style="font-family:var(--mono);font-size:14px;font-weight:600;fill:var(--text-1);transform:rotate(90deg);transform-origin:45px 45px">${valTxt}</text>
      </svg>
      <div class="ring-label">${label}</div>
    </div>`;
  }
  document.getElementById('ring-wrap').innerHTML=
    ring(overallAcc,'var(--accent)',`퀴즈 정확도`,`${overallAcc}%`)+
    ring(learnedPct,'var(--green)',`SRS 학습률`,`${learnedPct}%`)+
    ring(wrongPct,'var(--red)',`오답 보유율`,`${wrongPct}%`);

  // Top wrong
  const topW=[...words].filter(w=>w.wrongCount>0).sort((a,b)=>b.wrongCount-a.wrongCount).slice(0,10);
  const maxW=topW[0]?.wrongCount||1;
  document.getElementById('top-wrong').innerHTML=topW.length?topW.map(w=>`
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="min-width:80px;font-size:12px;font-weight:600;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${w.en}</div>
      <div style="flex:1;height:6px;background:var(--bg-3);border-radius:99px;overflow:hidden">
        <div style="width:${Math.round(w.wrongCount/maxW*100)}%;height:100%;background:var(--red);border-radius:99px;transition:width 0.5s ease"></div>
      </div>
      <div style="font-family:var(--mono);font-size:11px;color:var(--red);min-width:28px;text-align:right">${w.wrongCount}</div>
    </div>`).join('')
    :`<div style="font-size:12px;color:var(--text-3)">오답 없음 — 완벽합니다! 🎉</div>`;
}

// ── INIT ──
document.addEventListener('DOMContentLoaded', ()=>{
  loadData();
  buildSim();
  renderWords();
  updateStudyDashboard();
  updateSRSBadge();
});
</script>

  projectId:"myvocaapp-d418d",
  storageBucket:"myvocaapp-d418d.firebasestorage.app",
  messagingSenderId:"841954793233",
  appId:"1:841954793233:web:2748be6eb03308e0895eb0"
};
const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);
const dot=document.getElementById('cloud-dot');
const txt=document.getElementById('cloud-txt');
const setCloud=(c,t)=>{ dot.style.background=c; txt.textContent=t; };

let firstLoad=true;
signInAnonymously(auth).catch(()=>setCloud('#555','오프라인'));
onAuthStateChanged(auth,user=>{
  if(!user) return;
  setCloud('#e8a838','연결 중');
  const ref=doc(db,'shared_wordbook','my_private_data');
  let cloudDebounce;
  window.triggerCloud=data=>{
    clearTimeout(cloudDebounce);
    cloudDebounce=setTimeout(()=>{
      setCloud('#5c6bc0','저장 중...');
      setDoc(ref,{wordsList:JSON.stringify(data)})
        .then(()=>setCloud('#4caf7d','동기화 완료 ☁'))
        .catch(()=>setCloud('#e05c5c','저장 실패'));
    },2000);
  };
  onSnapshot(ref,snap=>{
    setCloud('#4caf7d','동기화 완료 ☁');
    if(snap.exists()){
      try{
        const d=JSON.parse(snap.data().wordsList);
        window.updateFromCloud(d);
        if(firstLoad){ window.toast('☁ 클라우드 동기화 완료'); }
      } catch(e){ console.error(e); }
    }
    firstLoad=false;
  },()=>setCloud('#e05c5c','오프라인'));
});
</script>
